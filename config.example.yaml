# ai-sre example configuration
# Copy to /etc/ai-sre/config.yaml and adjust for your environment.

state: /var/lib/ai-sre/state.db

# MCP servers the agent may call as tools during investigation.
# Tools are auto-discovered via tools/list at startup — no hardcoding needed.
# Stateful servers (e.g. mcp-victoriametrics) receive an initialize handshake
# automatically; the session ID is then used on every subsequent call.
mcp_servers:
  # Read-only Kubernetes access.
  - name: k8s
    url: http://kubernetes-mcp-ro.kubernetes-mcp.svc:8080
    token: ""  # no auth in-cluster; NetworkPolicy controls access

  # VictoriaMetrics metrics (stateful — requires MCP session).
  - name: metrics
    url: http://mcp-victoriametrics.monitoring.svc:8080
    token: ""

  # VictoriaLogs (when mcp-victorialogs is deployed).
  # - name: logs
  #   url: http://mcp-victorialogs.monitoring.svc:8080
  #   token: ""

# Sources list is used by the observer's log-pattern adapter for direct polling.
# It is separate from mcp_servers and does not affect the agent's tool list.
sources: []

investigate:
  enabled: true
  base_url: http://llm-gateway:8000/v1  # OpenAI-compatible endpoint (or LM Studio for dev)
  api_key: ""                            # set via secret mount
  model: google/gemma-4-26b-a4b-it
  max_steps: 8
  max_tokens_step: 512
  max_tokens_final: 1200
  step_timeout: 120s
  total_timeout: 600s
  concurrency: 1
  # Board actor to escalate application/code bugs to. Default: on-call-dev.
  escalate_to_code_bugs: "on-call-dev"
  # Board actor to escalate operator/infra decisions to. Default: on-call-ops.
  escalate_to_infra: "on-call-ops"
  # Optional site context prepended to the system prompt.
  system_prompt: |
    Site context: production Kubernetes cluster.

observer:
  interval: 60s
  quiet_window_default: 1h
  error_rate_threshold_pct: 5.0
  memory_growth_threshold_mb_per_hour: 50
  fail_open_patterns:
    - OOMKilled
    - connection refused
    - ModelNotMappedError
    - "No api key passed"
  # Grafana/Alertmanager webhook receiver.
  # Configure Grafana to POST alerts to http://<pod>:8081/webhook.
  alert_webhook:
    enabled: false
    addr: ":8081"
    token: ""   # optional bearer token

actions:
  # All false by default — escalate-only mode.
  allow_pod_restart: false
  allow_rollout_restart: false
  allow_scale: false
  allow_systemd_restart: false

sinks:
  stdout_json: true
  board:
    enabled: false
    url: ""
    token: ""
    min_severity: high
  webhook:
    enabled: false
    url: ""
    token: ""
